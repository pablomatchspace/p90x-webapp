name: Update smoke snapshots (linux)

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Regenerate linux visual baselines for e2e/smoke.spec.ts after a legit
      # UI change (E16 added a Play-workout button to the Today completion card,
      # which drifts the full-page skip/swap modal shots pinned to a Plyo day).
      - run: npx playwright test e2e/smoke.spec.ts --update-snapshots
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v7
        with:
          name: smoke-snapshots-linux
          path: e2e/smoke.spec.ts-snapshots/
          retention-days: 7
