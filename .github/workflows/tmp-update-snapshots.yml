# TEMPORARY (E37): regenerates the linux visual baselines on the CI runner and
# commits them back to this branch. Deleted again in the next commit.
name: tmp-update-snapshots

on:
  push:
    branches: [ccr-e239690a-8scgy6]

permissions:
  contents: write

jobs:
  update:
    if: contains(github.event.head_commit.message, '[update-snapshots]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test e2e/smoke.spec.ts --update-snapshots=changed
        env:
          CI: 'true'
      - name: Commit regenerated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/smoke.spec.ts-snapshots/*-linux.png
          git diff --cached --quiet && echo "no snapshot changes" && exit 0
          git commit -m "test(e2e): regenerate linux visual baselines for E37 gear rows"
          git push
